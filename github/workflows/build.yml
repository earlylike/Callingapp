name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Unzip the project
        run: unzip -q ./*.zip

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build the APK
        working-directory: TogetherTune
        run: gradle assembleDebug --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp TogetherTune/app/build/outputs/apk/debug/app-debug.apk TogetherTune.apk
          gh release create "build-${{ github.run_number }}" TogetherTune.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "TogetherTune build ${{ github.run_number }}" \
            --notes "Debug APK. Install it on both phones."

      - uses: actions/upload-artifact@v4
        with:
          name: TogetherTune-debug-apk
          path: TogetherTune/app/build/outputs/apk/debug/app-debug.apk
